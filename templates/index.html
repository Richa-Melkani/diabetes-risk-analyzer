<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Diabetes Risk Analyzer</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h2>Diabetes Risk Analyzer</h2>

        <form action="/predict" method="post" onsubmit="return validateForm()">

            <div class="form-group">
                <label>
                    Glucose Level:
                    <input type="number" step="any" name="Glucose" required>
                </label>
            </div>

            <div class="form-group">
                <label>
                    Blood Pressure:
                    <input type="number" step="any" name="BloodPressure" required>
                </label>
            </div>

            <div class="form-group">
                <label>
                    BMI:
                    <input type="number" step="any" name="BMI" required>
                </label>
            </div>

            <div class="form-group">
                <label>
                    Age:
                    <input type="number" step="any" name="Age" required>
                </label>
            </div>

            <div class="form-group">
                <label>
                    Diabetes Pedigree Function:
                    <input type="number" step="any" name="DPF" required>
                </label>
            </div>

            <button type="submit">Predict</button>

        </form>

        <div class="result">

            {% if prediction_text %}
                <h3>{{ prediction_text }}</h3>

                {% if risk_text %}
                    <h3 id="risk">{{ risk_text }}</h3>
                    <h4>Probability: {{ prob_text }}</h4>
                {% endif %}

                <p>{{ suggestion_text }}</p>
            {% endif %}

        </div>

    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
