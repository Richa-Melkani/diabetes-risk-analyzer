<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diabetes Risk Analyzer</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h2>Diabetes Risk Analyzer</h2>

        <form action="/predict" method="post" onsubmit="return validateForm()">

            <div class="form-group">
                <label for="glucose">Glucose Level</label>
                <input type="number" step="any" id="glucose" name="Glucose" placeholder="Enter glucose level" required>
            </div>

            <div class="form-group">
                <label for="bp">Blood Pressure</label>
                <input type="number" step="any" id="bp" name="BloodPressure" placeholder="Enter blood pressure" required>
            </div>

            <div class="form-group">
                <label for="bmi">BMI</label>
                <input type="number" step="any" id="bmi" name="BMI" placeholder="Enter BMI" required>
            </div>

            <div class="form-group">
                <label for="age">Age</label>
                <input type="number" step="any" id="age" name="Age" placeholder="Enter age" required>
            </div>

            <div class="form-group">
                <label for="dpf">Diabetes Pedigree Function</label>
                <input type="number" step="any" id="dpf" name="DPF" placeholder="Enter DPF value" required>
            </div>

            <button type="submit">Predict</button>

        </form>

        <div class="result">

            {% if prediction_text %}
                <h3>{{ prediction_text }}</h3>

                {% if risk_text %}
                    <h3 id="risk">{{ risk_text }}</h3>
                    <h4>Probability: {{ prob_text }}</h4>
                {% endif %}

                <p>{{ suggestion_text }}</p>
            {% endif %}

        </div>

    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
